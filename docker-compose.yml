# Phase 3: postgres only, so the api can be developed against a real database
# with `npm run dev` on the host. Phase 12 adds the `api` and `web` services.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tesla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tesla}
      POSTGRES_DB: ${POSTGRES_DB:-tesla_pool}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tesla} -d ${POSTGRES_DB:-tesla_pool}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
